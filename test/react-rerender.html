<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PagePatch React-style rerender test</title>
</head>
<body data-rerenders="0">
  <main>
    <h1 id="react-heading">Original framework heading</h1>
    <p>This fixture replaces the selected DOM node after load, like a client framework rerender.</p>
    <div id="busy-region" aria-hidden="true"></div>
  </main>
  <script>
    var mutationTick = 0;
    setInterval(function () {
      mutationTick += 1;
      document.querySelector("#busy-region").dataset.tick = String(mutationTick);
    }, 25);
    setTimeout(function () {
      var heading = document.querySelector("#react-heading");
      var replacement = heading.cloneNode(true);
      replacement.textContent = "Original framework heading";
      heading.replaceWith(replacement);
      document.body.dataset.rerenders = "1";
    }, 900);
  </script>
  <script src="../dist/pagepatch.js"></script>
</body>
</html>
