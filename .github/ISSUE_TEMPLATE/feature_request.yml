name: Feature request
description: Suggest a focused improvement to PagePatch.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the current workflow and where it becomes difficult.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like PagePatch to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today?

